name: Build

# Runs on EVERY push: compiles ViGEmClient.dll from source + builds the app,
# and uploads the finished package as an artifact. Only the "Publish GitHub
# Release" step is gated to version tags (v*); everything else runs on any push.
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (ViGEmClient + app)
    runs-on: windows-2022
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # C++ toolchain needed to compile ViGEmClient from source.
      - name: Set up MSVC (C++ build tools)
        uses: ilammy/msvc-dev-cmd@v1

      # Fetch the ViGEmClient SOURCE via actions/checkout (no git-auth prompt).
      - name: Checkout ViGEmClient source
        uses: actions/checkout@v4
        with:
          repository: nefarius/ViGEmClient
          path: third_party/ViGEmClient

      # 1) Compile the OFFICIAL ViGEmClient.dll from source (this is your ps1)
      - name: Build ViGEmClient.dll from source
        shell: pwsh
        run: .\tools\build-vigemclient.ps1 -OutDir (Get-Location) -SourceDir "$env:GITHUB_WORKSPACE\third_party\ViGEmClient"

      # 2) Build TouchCloudPad.exe (C# .NET Framework 4.8, system csc.exe)
      - name: Build TouchCloudPad.exe
        shell: cmd
        run: build.bat

      # 3) Download the ViGEmBus driver installer (self-contained package).
      #    Uses GITHUB_TOKEN to avoid anonymous API rate limits; non-fatal so a
      #    transient rate-limit does not break the whole build/release.
      - name: Download ViGEmBus driver installer
        shell: pwsh
        run: |
          try {
            $h = @{ 'User-Agent' = 'TouchCloudPad'; 'Authorization' = "Bearer $env:GITHUB_TOKEN" }
            $rel = Invoke-RestMethod -Uri "https://api.github.com/repos/nefarius/ViGEmBus/releases/latest" -Headers $h
            $a = $rel.assets | Where-Object { $_.name -match '\.(msi|exe)$' -and $_.name -notmatch 'arm' } | Select-Object -First 1
            if (-not $a) { throw "No ViGEmBus installer asset found" }
            $ext = $a.name.Substring($a.name.LastIndexOf('.') + 1)
            Invoke-WebRequest -Uri $a.browser_download_url -OutFile "drivers\ViGEmBus_Setup.$ext"
            Write-Host "Downloaded $($a.name) -> drivers\ViGEmBus_Setup.$ext"
          } catch {
            Write-Host "::warning::Could not download ViGEmBus driver: $($_.Exception.Message)"
            Write-Host "The driver is available manually at https://github.com/nefarius/ViGEmBus/releases/latest"
          }

      # 4) Verify the DLL was actually produced
      - name: Verify outputs
        shell: pwsh
        run: |
          if (-not (Test-Path .\TouchCloudPad.exe)) { throw "TouchCloudPad.exe missing" }
          if (-not (Test-Path .\ViGEmClient.dll)) { throw "ViGEmClient.dll missing - the ps1 did not produce it" }
          $b = [IO.File]::ReadAllBytes((Resolve-Path .\ViGEmClient.dll))
          $pe = [BitConverter]::ToInt32($b, 0x3C); $m = [BitConverter]::ToUInt16($b, $pe + 4)
          Write-Host "ViGEmClient.dll machine=0x$('{0:X4}' -f $m) size=$($b.Length) bytes"

      # 5) Package everything
      - name: Package
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'stage'
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item .\TouchCloudPad.exe, .\ViGEmClient.dll, .\README.md -Destination $stage -Force
          New-Item -ItemType Directory -Path (Join-Path $stage 'drivers') -Force | Out-Null
          Copy-Item .\drivers\* -Destination (Join-Path $stage 'drivers') -Recurse -Force
          Copy-Item .\build.bat -Destination $stage -Force
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath TouchCloudPad-release.zip -Force
          Get-Item TouchCloudPad-release.zip | Select-Object Name, Length

      # 6) Upload the package as an artifact (available on every run)
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TouchCloudPad
          path: TouchCloudPad-release.zip

      # 7) Publish a GitHub Release (only when pushing a v* tag)
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: TouchCloudPad-release.zip
          generate_release_notes: true
