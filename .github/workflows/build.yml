name: Build

# - Every push: fast "can it compile" check (builds TouchCloudPad.exe only).
# - Pushing a tag v* (or manual run): full build (compiles ViGEmClient.dll from
#   source, builds the app, downloads the ViGEmBus driver) + GitHub Release.
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # Fast compile check on every push
  # ---------------------------------------------------------------------------
  build-check:
    name: Compile check (TouchCloudPad.exe)
    runs-on: windows-2022
    if: github.event_name == 'push' && github.ref_type != 'tag'
    steps:
      - uses: actions/checkout@v4

      - name: Build TouchCloudPad.exe
        shell: cmd
        run: build.bat

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TouchCloudPad-check
          path: TouchCloudPad.exe

  # ---------------------------------------------------------------------------
  # Full build + release (tags or manual dispatch)
  # ---------------------------------------------------------------------------
  release:
    name: Full build & release
    runs-on: windows-2022
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # C++ toolchain needed to compile ViGEmClient from source.
      - name: Set up MSVC (C++ build tools)
        uses: ilammy/msvc-dev-cmd@v1

      # Fetch the ViGEmClient SOURCE via actions/checkout (no git-auth prompt).
      - name: Checkout ViGEmClient source
        uses: actions/checkout@v4
        with:
          repository: nefarius/ViGEmClient
          path: third_party/ViGEmClient

      # 1) Compile the OFFICIAL ViGEmClient.dll from source
      - name: Build ViGEmClient.dll from source
        shell: pwsh
        run: .\tools\build-vigemclient.ps1 -OutDir (Get-Location) -SourceDir "$env:GITHUB_WORKSPACE\third_party\ViGEmClient"

      # 2) Build TouchCloudPad.exe (C# .NET Framework 4.8, system csc.exe)
      - name: Build TouchCloudPad.exe
        shell: cmd
        run: build.bat

      # 3) Download the ViGEmBus driver installer (self-contained release)
      - name: Download ViGEmBus driver installer
        shell: pwsh
        run: |
          $rel = Invoke-RestMethod -Uri "https://api.github.com/repos/nefarius/ViGEmBus/releases/latest" -Headers @{ 'User-Agent'='TouchCloudPad' }
          $a = $rel.assets | Where-Object { $_.name -match '\.(msi|exe)$' -and $_.name -notmatch 'arm' } | Select-Object -First 1
          if (-not $a) { throw "No ViGEmBus installer asset found" }
          $ext = $a.name.Substring($a.name.LastIndexOf('.') + 1)
          Invoke-WebRequest -Uri $a.browser_download_url -OutFile "drivers\ViGEmBus_Setup.$ext"
          Write-Host "Downloaded $($a.name)"

      # 4) Verify outputs
      - name: Verify outputs
        shell: pwsh
        run: |
          if (-not (Test-Path .\TouchCloudPad.exe)) { throw "TouchCloudPad.exe missing" }
          if (-not (Test-Path .\ViGEmClient.dll)) { throw "ViGEmClient.dll missing" }
          $b = [IO.File]::ReadAllBytes((Resolve-Path .\ViGEmClient.dll))
          $pe = [BitConverter]::ToInt32($b, 0x3C); $m = [BitConverter]::ToUInt16($b, $pe + 4)
          Write-Host "ViGEmClient.dll machine=0x$('{0:X4}' -f $m) size=$($b.Length) bytes"

      # 5) Package everything
      - name: Package release
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'stage'
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item .\TouchCloudPad.exe, .\ViGEmClient.dll, .\README.md -Destination $stage -Force
          New-Item -ItemType Directory -Path (Join-Path $stage 'drivers') -Force | Out-Null
          Copy-Item .\drivers\* -Destination (Join-Path $stage 'drivers') -Recurse -Force
          Copy-Item .\build.bat -Destination $stage -Force
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath TouchCloudPad-release.zip -Force
          Get-Item TouchCloudPad-release.zip | Select-Object Name, Length

      # 6) Upload artifact (always, so manual runs have a download)
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TouchCloudPad-release
          path: TouchCloudPad-release.zip

      # 7) Publish GitHub Release (only on tags)
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: TouchCloudPad-release.zip
          generate_release_notes: true
